name: ORB-1 reference comparison

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orb1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orb1-comparison:
    name: Capture Horizons and compare Skyfield
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out observation lab
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned calculation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Record execution environment
        run: |
          mkdir -p environment
          python --version | tee environment/python-version.txt
          python -m pip freeze | tee environment/pip-freeze.txt

      - name: Capture ORB-1 Horizons reference
        run: |
          python capture_horizons_reference.py \
            --epoch "2026-11-03 12:00:00"

      - name: Compare libephemeris Skyfield variants
        run: python compare_orb1.py

      - name: Upload ORB-1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb1-evidence-${{ github.run_number }}
          path: |
            reference-data/horizons/
            results/
            environment/
          if-no-files-found: warn
          retention-days: 30
