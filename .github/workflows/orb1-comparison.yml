name: ORB-1 bounded reference comparison

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orb1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orb1-comparison:
    name: Capture discriminating Horizons epochs and compare Skyfield
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out observation lab
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned calculation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Record execution environment
        run: |
          mkdir -p environment
          python --version | tee environment/python-version.txt
          python -m pip freeze | tee environment/pip-freeze.txt
      - name: Capture four ORB-1 epochs from Horizons
        run: |
          python capture_horizons_reference.py \
            --epoch '2026-02-03 12:00:00' \
            --epoch '2026-05-03 12:00:00' \
            --epoch '2026-08-03 12:00:00' \
            --epoch '2026-11-03 12:00:00'
      - name: Compare libephemeris Skyfield frame variants
        run: python compare_orb1.py
      - name: Record bundled Skyfield JPL ephemeris
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import skyfield_data
          root = Path(skyfield_data.__file__).resolve().parent
          out = Path('environment/jpl-ephemeris-inventory.txt')
          files = sorted(root.rglob('de*.bsp'))
          with out.open('w', encoding='utf-8') as report:
              for path in files:
                  digest = hashlib.sha256()
                  with path.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          digest.update(chunk)
                  report.write(f'{path}\\t{path.stat().st_size} bytes\\tsha256={digest.hexdigest()}\\n')
          print(out.read_text(encoding='utf-8'), end='')
          PY
      - name: Upload ORB-1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb1-bounded-evidence-${{ github.run_number }}
          path: |
            reference-data/horizons/
            results/
            environment/
          if-no-files-found: warn
          retention-days: 30
